<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your cart · NEVER GIVE UP ENTERPRISE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { brand: { 500:'#3b82f6',600:'#2563eb',700:'#1d4ed8' }, leaf: { 500:'#10b981',600:'#059669' } } } } };
  </script>
</head>
<body class="font-sans bg-slate-50 text-slate-800">
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
      <a href="/" class="flex items-center gap-3">
        <span class="h-10 w-10 rounded-full bg-gradient-to-r from-brand-500 to-leaf-500 text-white font-extrabold flex items-center justify-center text-sm">NGU</span>
        <span class="hidden sm:block leading-tight"><span class="block text-sm font-extrabold">NEVER GIVE UP</span><span class="block text-[11px] text-slate-500 tracking-widest">ENTERPRISE</span></span>
      </a>
      <nav class="hidden md:flex gap-6 text-sm font-medium">
        <a href="/products/" class="hover:text-brand-600">Products</a>
        <a href="/branches/" class="hover:text-brand-600">Branches</a>
        <a href="/contact.html" class="hover:text-brand-600">Contact</a>
      </nav>
      <a href="/cart/" class="relative p-2"><i class="fa-solid fa-cart-shopping text-lg"></i><span id="cart-count" class="absolute -top-1 -right-1 bg-brand-600 text-white text-[10px] font-bold h-5 min-w-[20px] px-1 rounded-full flex items-center justify-center" style="display:none;">0</span></a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h1 class="text-3xl font-extrabold">Your cart</h1>
    <p class="text-slate-500 mt-1">Review your items and proceed to checkout.</p>

    <div id="cart-root" class="mt-8 grid lg:grid-cols-3 gap-6">
      <div id="cart-items" class="lg:col-span-2 space-y-3">
        <p class="text-slate-500">Loading…</p>
      </div>
      <aside id="cart-summary" class="bg-white rounded-xl ring-1 ring-slate-100 p-6 h-fit"></aside>
    </div>
  </main>

  <script type="module">
    import { readCart, updateQty, removeItem, cartTotal, cartCount } from '/assets/js/brand.js';

    const itemsRoot = document.getElementById('cart-items');
    const summaryRoot = document.getElementById('cart-summary');

    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

    function render() {
      const items = readCart();
      if (!items.length) {
        itemsRoot.innerHTML = `
          <div class="bg-white rounded-xl ring-1 ring-slate-100 p-10 text-center">
            <i class="fa-solid fa-cart-shopping text-4xl text-slate-300"></i>
            <p class="mt-4 text-slate-600 font-semibold">Your cart is empty</p>
            <p class="text-sm text-slate-500 mt-1">Browse our products and add items to your cart.</p>
            <a href="/products/" class="mt-4 inline-flex items-center gap-2 px-5 py-2 rounded-md bg-brand-600 text-white font-semibold hover:bg-brand-700">Browse products <i class="fa-solid fa-arrow-right"></i></a>
          </div>`;
        summaryRoot.innerHTML = '';
        return;
      }

      itemsRoot.innerHTML = items.map((i) => `
        <div class="bg-white rounded-xl ring-1 ring-slate-100 p-4 flex gap-4 items-center" data-id="${esc(i.id)}">
          <img src="${esc(i.image || '/assets/images/logo.svg')}" alt="${esc(i.name)}" class="h-20 w-20 rounded-lg object-cover bg-slate-100" />
          <div class="flex-1 min-w-0">
            <h3 class="font-semibold truncate">${esc(i.name)}</h3>
            <p class="text-sm text-brand-600 font-bold">KES ${Number(i.price).toLocaleString()}</p>
            <div class="mt-2 flex items-center gap-2">
              <button data-action="dec" class="h-7 w-7 rounded-md ring-1 ring-slate-200 hover:ring-brand-300 flex items-center justify-center"><i class="fa-solid fa-minus text-xs"></i></button>
              <span class="w-8 text-center text-sm font-medium">${i.qty}</span>
              <button data-action="inc" class="h-7 w-7 rounded-md ring-1 ring-slate-200 hover:ring-brand-300 flex items-center justify-center"><i class="fa-solid fa-plus text-xs"></i></button>
              <button data-action="remove" class="ml-3 text-xs text-red-500 hover:underline">Remove</button>
            </div>
          </div>
          <div class="text-right">
            <p class="font-bold">KES ${(i.price * i.qty).toLocaleString()}</p>
          </div>
        </div>
      `).join('');

      itemsRoot.querySelectorAll('[data-action]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const row = btn.closest('[data-id]');
          const id = row.getAttribute('data-id');
          const item = readCart().find((x) => x.id === id);
          if (!item) return;
          const action = btn.getAttribute('data-action');
          if (action === 'inc') updateQty(id, item.qty + 1);
          if (action === 'dec') updateQty(id, item.qty - 1);
          if (action === 'remove') removeItem(id);
          render();
        });
      });

      const total = cartTotal();
      summaryRoot.innerHTML = `
        <h2 class="text-lg font-bold">Order summary</h2>
        <div class="mt-4 space-y-2 text-sm">
          <div class="flex justify-between"><span class="text-slate-600">Subtotal</span><span class="font-medium">KES ${total.toLocaleString()}</span></div>
          <div class="flex justify-between"><span class="text-slate-600">Delivery</span><span class="text-slate-500">Calculated at checkout</span></div>
          <div class="border-t border-slate-200 pt-2 mt-2 flex justify-between text-base"><span class="font-bold">Total</span><span class="font-extrabold text-brand-600">KES ${total.toLocaleString()}</span></div>
        </div>
        <a href="/cart/checkout.html" class="mt-6 flex items-center justify-center gap-2 w-full px-5 py-3 rounded-md bg-brand-600 text-white font-semibold hover:bg-brand-700">Checkout <i class="fa-solid fa-arrow-right"></i></a>
        <a href="/products/" class="mt-3 block text-center text-sm text-slate-500 hover:text-brand-600">Continue shopping</a>
      `;
    }

    render();
    document.addEventListener('cart:updated', render);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout · NEVER GIVE UP ENTERPRISE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { brand: { 500:'#3b82f6',600:'#2563eb',700:'#1d4ed8' }, leaf: { 500:'#10b981',600:'#059669' } } } } };
  </script>
</head>
<body class="font-sans bg-slate-50 text-slate-800">
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
      <a href="/" class="flex items-center gap-3">
        <span class="h-10 w-10 rounded-full bg-gradient-to-r from-brand-500 to-leaf-500 text-white font-extrabold flex items-center justify-center text-sm">NGU</span>
        <span class="hidden sm:block leading-tight"><span class="block text-sm font-extrabold">NEVER GIVE UP</span><span class="block text-[11px] text-slate-500 tracking-widest">ENTERPRISE</span></span>
      </a>
      <a href="/cart/" class="relative p-2"><i class="fa-solid fa-cart-shopping text-lg"></i><span id="cart-count" class="absolute -top-1 -right-1 bg-brand-600 text-white text-[10px] font-bold h-5 min-w-[20px] px-1 rounded-full flex items-center justify-center" style="display:none;">0</span></a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h1 class="text-3xl font-extrabold">Checkout</h1>
    <p class="text-slate-500 mt-1">Complete your order details. We'll confirm by phone.</p>

    <div id="checkout-wrap" class="mt-8 grid lg:grid-cols-3 gap-6">
      <form id="checkout-form" class="lg:col-span-2 bg-white rounded-xl ring-1 ring-slate-100 p-6 space-y-4">
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="text-sm font-medium">Full name *</label>
            <input name="name" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500" />
          </div>
          <div>
            <label class="text-sm font-medium">Phone *</label>
            <input name="phone" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500" />
          </div>
        </div>
        <div>
          <label class="text-sm font-medium">Email</label>
          <input name="email" type="email" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500" />
        </div>
        <div>
          <label class="text-sm font-medium">Delivery address *</label>
          <textarea name="address" rows="3" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
        </div>
        <div>
          <label class="text-sm font-medium">Delivery branch</label>
          <select name="branch" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500">
            <option value="">Pickup at any branch</option>
            <option value="kikuyu">Kikuyu</option>
            <option value="nakuru">Nakuru</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-medium">Notes (optional)</label>
          <textarea name="notes" rows="2" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
        </div>
        <div id="error-box" class="hidden p-3 rounded-md bg-red-50 border border-red-200 text-red-700 text-sm"></div>
        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-md bg-brand-600 text-white font-semibold hover:bg-brand-700">
          Place order
        </button>
      </form>

      <aside class="bg-white rounded-xl ring-1 ring-slate-100 p-6 h-fit">
        <h2 class="text-lg font-bold">Order summary</h2>
        <div id="summary-items" class="mt-3 space-y-2 text-sm"></div>
        <div class="mt-4 border-t border-slate-200 pt-3 flex justify-between font-bold">
          <span>Total</span>
          <span id="summary-total" class="text-brand-600">KES 0</span>
        </div>
      </aside>
    </div>

    <div id="success-wrap" class="hidden mt-8 bg-white rounded-xl ring-1 ring-slate-100 p-10 text-center">
      <div class="inline-flex items-center justify-center h-16 w-16 rounded-full bg-leaf-500 text-white text-2xl"><i class="fa-solid fa-check"></i></div>
      <h2 class="mt-4 text-2xl font-extrabold">Order placed!</h2>
      <p class="mt-2 text-slate-600">We've received your order. We'll call you on the phone number you provided to confirm delivery.</p>
      <p class="mt-1 text-sm text-slate-500">Order reference: <span id="order-ref" class="font-mono font-semibold">—</span></p>
      <a href="/products/" class="mt-6 inline-flex items-center gap-2 px-5 py-2 rounded-md bg-brand-600 text-white font-semibold hover:bg-brand-700">Continue shopping</a>
    </div>
  </main>

  <script type="module">
    import { readCart, cartTotal, clearCart } from '/assets/js/brand.js';
    const itemsRoot = document.getElementById('summary-items');
    const totalRoot = document.getElementById('summary-total');
    const form = document.getElementById('checkout-form');
    const errorBox = document.getElementById('error-box');
    const successWrap = document.getElementById('success-wrap');
    const formWrap = document.getElementById('checkout-wrap');

    const items = readCart();
    if (!items.length) {
      formWrap.innerHTML = '<div class="col-span-3 bg-white rounded-xl ring-1 ring-slate-100 p-10 text-center"><p class="text-slate-600 font-semibold">Your cart is empty.</p><a href="/products/" class="mt-4 inline-flex items-center gap-2 px-5 py-2 rounded-md bg-brand-600 text-white font-semibold">Browse products</a></div>';
    } else {
      itemsRoot.innerHTML = items.map((i) => `
        <div class="flex justify-between"><span class="truncate">${escapeHtml(i.name)} × ${i.qty}</span><span>KES ${(i.price*i.qty).toLocaleString()}</span></div>
      `).join('');
      totalRoot.textContent = 'KES ' + cartTotal().toLocaleString();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      const data = Object.fromEntries(new FormData(form));
      const payload = { customer: data, items: items.map((i) => ({ id: i.id, name: i.name, qty: i.qty, price: i.price })) };

      try {
        const res = await fetch('/api/cart/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const body = await res.json();
        if (!res.ok || body.error) throw new Error(body.error?.message || 'Checkout failed');

        const orderId = body.data?.orderId || body.data?.id || 'unknown';
        document.getElementById('order-ref').textContent = orderId;
        formWrap.classList.add('hidden');
        successWrap.classList.remove('hidden');
        clearCart();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
      }
    });

    function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  </script>
</body>
</html>

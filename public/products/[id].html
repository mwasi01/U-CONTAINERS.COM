<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product · NEVER GIVE UP ENTERPRISE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] }, colors: { brand: { 500:'#3b82f6',600:'#2563eb',700:'#1d4ed8' }, leaf: { 500:'#10b981',600:'#059669' } } } } };
  </script>
</head>
<body class="font-sans bg-slate-50 text-slate-800">
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
      <a href="/" class="flex items-center gap-3">
        <span class="h-10 w-10 rounded-full bg-gradient-to-r from-brand-500 to-leaf-500 text-white font-extrabold flex items-center justify-center text-sm">NGU</span>
        <span class="hidden sm:block leading-tight"><span class="block text-sm font-extrabold">NEVER GIVE UP</span><span class="block text-[11px] text-slate-500 tracking-widest">ENTERPRISE</span></span>
      </a>
      <nav class="hidden md:flex gap-6 text-sm font-medium">
        <a href="/products/" class="hover:text-brand-600">Products</a>
        <a href="/branches/" class="hover:text-brand-600">Branches</a>
        <a href="/about.html" class="hover:text-brand-600">About</a>
        <a href="/services.html" class="hover:text-brand-600">Services</a>
        <a href="/contact.html" class="hover:text-brand-600">Contact</a>
      </nav>
      <a href="/cart/" class="relative p-2"><i class="fa-solid fa-cart-shopping text-lg"></i><span id="cart-count" class="absolute -top-1 -right-1 bg-brand-600 text-white text-[10px] font-bold h-5 min-w-[20px] px-1 rounded-full flex items-center justify-center" style="display:none;">0</span></a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <nav class="text-sm text-slate-500 mb-6"><a href="/" class="hover:text-brand-600">Home</a> / <a href="/products/" class="hover:text-brand-600">Products</a> / <span id="crumb-current" class="text-slate-800">Product</span></nav>

    <div id="product-root" class="bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm overflow-hidden grid md:grid-cols-2 gap-0">
      <div class="aspect-square bg-slate-100 flex items-center justify-center">
        <p class="text-slate-400">Loading…</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { addToCart } from '/assets/js/brand.js';
    import { productImage } from '/assets/js/product-images.js';

    const id = decodeURIComponent(location.pathname.split('/').pop().replace(/\.html$/, ''));
    const root = document.getElementById('product-root');

    async function load() {
      try {
        const res = await fetch('/api/products/' + encodeURIComponent(id));
        const payload = await res.json();
        const p = payload.data;
        if (!p) { root.innerHTML = '<div class="col-span-full p-10 text-center text-slate-500">Product not found.</div>'; return; }
        document.title = p.name + ' · NEVER GIVE UP ENTERPRISE';
        document.getElementById('crumb-current').textContent = p.name;

        const img = productImage(p);

        root.innerHTML = `
          <div class="aspect-square bg-slate-100 overflow-hidden">
            <img src="${img}" alt="${esc(p.name)}" class="w-full h-full object-cover" />
          </div>
          <div class="p-8 md:p-12 flex flex-col">
            <p class="text-xs font-bold tracking-widest uppercase text-brand-600">${esc(p.category_slug || 'Product')}</p>
            <h1 class="mt-2 text-3xl font-extrabold">${esc(p.name)}</h1>
            <p class="mt-4 text-slate-600 leading-relaxed">${esc(p.description || '')}</p>
            <p class="mt-6 text-4xl font-extrabold text-brand-600">KES ${Number(p.price || 0).toLocaleString()}</p>
            <p class="mt-1 text-sm text-slate-500">Price inclusive of VAT</p>

            <div class="mt-8 flex items-center gap-3">
              <div class="flex items-center rounded-md ring-1 ring-slate-200">
                <button id="qty-dec" class="px-3 py-2 text-slate-600 hover:text-brand-600"><i class="fa-solid fa-minus"></i></button>
                <input id="qty" type="number" value="1" min="1" class="w-14 text-center focus:outline-none" />
                <button id="qty-inc" class="px-3 py-2 text-slate-600 hover:text-brand-600"><i class="fa-solid fa-plus"></i></button>
              </div>
              <button id="add-to-cart" class="flex-1 inline-flex items-center justify-center gap-2 px-6 py-3 rounded-md bg-leaf-500 text-white font-semibold hover:bg-leaf-600">
                <i class="fa-solid fa-cart-plus"></i> Add to cart
              </button>
            </div>

            <div class="mt-6 text-sm text-slate-500 space-y-1">
              <p><i class="fa-solid fa-truck text-leaf-600 mr-2"></i> Countrywide delivery</p>
              <p><i class="fa-solid fa-shield-halved text-leaf-600 mr-2"></i> Quality guaranteed</p>
              <p><i class="fa-solid fa-phone text-leaf-600 mr-2"></i> Call <a href="tel:+254704787011" class="text-brand-600 hover:underline">+254 704 787 011</a> for bulk orders</p>
            </div>

            <a href="/products/${encodeURIComponent(p.category_slug || '')}.html" class="mt-8 inline-flex items-center gap-2 text-sm text-brand-600 hover:text-brand-700">
              ← Back to ${esc(p.category_slug || 'products')}
            </a>
          </div>
        `;

        const qtyInput = document.getElementById('qty');
        const dec = document.getElementById('qty-dec');
        const inc = document.getElementById('qty-inc');
        const btn = document.getElementById('add-to-cart');

        dec.addEventListener('click', () => { qtyInput.value = Math.max(1, Number(qtyInput.value) - 1); });
        inc.addEventListener('click', () => { qtyInput.value = Number(qtyInput.value) + 1; });
        btn.addEventListener('click', () => {
          const qty = Math.max(1, Number(qtyInput.value) || 1);
          addToCart({ id: p.id, name: p.name, price: Number(p.price) || 0, image: img }, qty);
          const original = btn.innerHTML;
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Added';
          btn.classList.replace('bg-leaf-500', 'bg-brand-600');
          setTimeout(() => { btn.innerHTML = original; btn.classList.replace('bg-brand-600', 'bg-leaf-500'); }, 1200);
        });
      } catch (e) {
        root.innerHTML = '<div class="col-span-full p-10 text-center text-red-500">Failed to load product.</div>';
      }
    }

    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    load();
  </script>
</body>
</html>
